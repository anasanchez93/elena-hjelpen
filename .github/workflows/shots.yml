name: Skjermbilder av appen
on:
  push:
    paths: [".github/workflows/shots.yml", "tools/shots.py"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/shots.py
      - if: always()
        run: |
          git config user.name "osm-bot"; git config user.email "osm-bot@users.noreply.github.com"
          git add tools/shots; git commit -m "Skjermbilder" || true
          git pull --rebase -q; git push
