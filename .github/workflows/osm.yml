name: Hent helsesteder fra OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/osm.yml", "tools/fetch_osm.sh", "tools/build_helse.py"]
  schedule:
    - cron: "17 4 1 * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/fetch_osm.sh
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add data/osm-raw.json.gz data/helse.json
          git commit -m "Oppdater helsesteder fra OpenStreetMap" || echo "ingen endringer"
          git pull --rebase -q && git push
