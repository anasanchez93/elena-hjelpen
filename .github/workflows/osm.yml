name: Hent helsesteder fra OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/osm.yml", "tools/fetch_osm.sh", "tools/build_helse.py", "tools/official.py"]
  schedule:
    - cron: "17 4 1 * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/fetch_osm.sh
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          mkdir -p /tmp/gen && cp -r data /tmp/gen/
          git fetch -q origin main && git reset -q --hard origin/main
          cp -r /tmp/gen/data/. data/
          git add data/osm-raw.json.gz data/helse.json data/offisiell data/oficial.json data/geocache.json
          git commit -m "Oppdater helsesteder (Ministerio de Sanidad + OpenStreetMap)" || echo "ingen endringer"
          git push
