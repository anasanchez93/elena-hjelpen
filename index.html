:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--sea)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 110px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 0 10px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--sea);display:grid;place-items:center;flex:none}
.brand{font-family:Poppins,sans-serif;font-weight:700;font-size:1.2rem}
.brand small{display:block;font-family:"Nunito Sans";font-weight:600;font-size:.78rem;color:var(--muted)}
.langsw{margin-left:auto;display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.langsw button{border:none;background:none;font:inherit;font-weight:800;font-size:.8rem;padding:5px 9px;border-radius:999px;cursor:pointer;color:var(--muted)}
.langsw button.on{background:var(--sea);color:#fff}
.sos{background:var(--red);color:#fff;font-weight:800;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.9rem;white-space:nowrap}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero{background:#27375C;color:#fff;border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:#334E6E;z-index:0}
.hero>*{position:relative;z-index:1}
.hero h1 em{font-style:normal;color:#E8B54F}
.hero p{color:#E6F0F7}
.es{display:block;font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.01em}
.hero .es{color:#BFD7E8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile:hover{border-color:var(--sea)}
.tile b{font-size:1rem}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--coral);color:var(--sea)}
.btn.sea{background:var(--sea);color:#fff}
.btn.ghost{background:var(--sea-2);color:var(--sea)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{background:var(--coral-2);border-radius:14px;padding:12px 14px;font-size:.92rem;margin-bottom:14px}
.note.green{background:var(--green-2)}
.note.blue{background:var(--sea-2)}
/* posts */
.posts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.post{display:flex;flex-direction:column;justify-content:flex-start;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;padding:0;font:inherit;text-align:left;color:inherit}
.post .img{aspect-ratio:4/5;display:grid;place-items:center;padding:12px;text-align:center}
.post .img b{font-family:Poppins,sans-serif;font-size:1.05rem;display:block;margin-top:8px}
.post .meta{padding:8px 10px;font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.post .thumb{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#27375C}
.posts .post:only-child{grid-column:1/-1}
.thumbwrap{position:relative;display:block}
.play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(39,55,92,.8);color:#fff;display:grid;place-items:center;font-size:1.3rem;padding-left:4px}
.reel{display:block;width:100%;max-height:72vh;aspect-ratio:9/16;background:#000;border-radius:18px;margin:12px 0}
.slideimg{flex:0 0 88%;scroll-snap-align:center;width:88%;border-radius:18px;display:block;box-shadow:var(--shadow)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,22,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--sand);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 26px}
.sheet .close{float:right;border:none;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:12px 0}
.slide{flex:0 0 88%;scroll-snap-align:center;aspect-ratio:4/5;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.slide .big{font-family:Poppins,sans-serif;font-size:1.6rem;font-weight:700;line-height:1.15}
.slide .small{font-size:.9rem;opacity:.75;margin-top:6px;font-weight:700}
.slide p{margin-top:12px;font-size:1rem}
/* guides */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted)}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 14px}
details ul{padding-left:20px;margin:0 0 .6em}
details li{margin-bottom:6px}
/* glossary */
input,select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label{font-weight:800;font-size:.92rem;display:block;margin:12px 0 6px}
.word{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:none}
.word .no{font-weight:800}
.word .esw{color:var(--sea);font-weight:700;text-align:right}
.say{border:none;background:var(--sea-2);color:var(--sea);border-radius:10px;padding:4px 9px;font-size:.8rem;font-weight:800;cursor:pointer;margin-top:4px}
/* booking */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.opt.on{border-color:var(--coral);background:#FFF8F5}
.opt .det{margin:4px 0 4px;padding-left:18px;font-size:.85rem;color:var(--muted)}
.opt .det li{margin-bottom:2px}
.opt .price{white-space:nowrap;color:var(--sea);font-size:1.05rem}
.opt small{display:block;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.day{flex:0 0 66px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.day b{display:block;font-size:1.2rem}
.day small{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.day.on{border-color:var(--coral);background:#FFF8F5}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font:inherit;font-weight:800;cursor:pointer;color:inherit}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot.on{border-color:var(--coral);background:var(--coral);color:var(--sea)}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--teal)}
.summary{background:var(--card);border:1px dashed var(--muted);border-radius:14px;padding:14px;white-space:pre-wrap;font-size:.93rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.92rem;margin-top:12px}
.check input{width:auto;margin-top:4px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;max-width:560px;width:100%}
nav.bottom a{flex:1;text-align:center;padding:9px 2px 10px;font-size:.74rem;font-weight:800;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom a.on{color:var(--sea)}
nav.bottom svg{width:24px;height:24px}
.footer{font-size:.8rem;color:var(--muted);text-align:center;margin-top:20px}
.emerg{display:flex;align-items:center;gap:14px;background:#FDECEC;border:1px solid #F5C6C6;border-radius:16px;padding:14px;margin-bottom:14px}
.emerg .num{font-family:Poppins,sans-serif;font-size:2rem;font-weight:700;color:var(--red)}

/* ---------- Bestill time ---------- */
const bk = {step:0, service:null, date:null, slot:null, name:"", contact:"", lang:0, note:"", ok:false, privacy:false, first:true, taken:new Set(), sending:false, done:false};
const api = (path, body) => fetch(`${CONFIG.supabase.url}/rest/v1/${path}`, {
  method: "POST",
  headers: Object.assign({ apikey: CONFIG.supabase.key, "Content-Type": "application/json", Prefer: "return=minimal" },
    SESSION ? { Authorization: `Bearer ${SESSION.access_token}` } : {}),
  body: JSON.stringify(body)
});
async function loadTaken(){
  try{
    const days = upcoming();
    const r = await api("rpc/taken_slots", { d_from: isoDate(days[0]), d_to: isoDate(days[days.length-1]) });
    if(!r.ok) throw 0;
    const rows = await r.json();
    bk.taken = new Set(rows.map(x => `${x.date} ${x.slot.slice(0,5)}`));
  }catch(e){ /* uten nett: vis alle tider */ }
}
const isTaken = (date, slot) => bk.taken.has(`${date} ${slot}`);
function upcoming(){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  for(let i=1;i<=CONFIG.daysAhead;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(x); }
  return out;
}
const pad = n => String(n).padStart(2,"0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
function slotsFor(iso){
  const ranges = CONFIG.schedule[new Date(iso+"T12:00:00").getDay()] || [];
  const out=[];
  ranges.forEach(([a,b])=>{ for(let m=toMin(a); m+CONFIG.slotMinutes<=toMin(b); m+=CONFIG.slotMinutes) out.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`); });
  return out;
}
const dayFull = iso => slotsFor(iso).every(s => isTaken(iso, s));
const fmtDate = d => LANG === "en"
  ? `${t("daysLong")[d.getDay()]} ${d.getDate()} ${t("months")[d.getMonth()]}`
  : `${t("daysLong")[d.getDay()]} ${d.getDate()}. ${t("months")[d.getMonth()]}`;
const priceText = s => `${s.from?t("from")+" ":""}${s.price} €`;
function openPrivacy(){
  $("#sheet").innerHTML = `<button class="close" aria-label="${t("close")}">×</button><h2 style="padding-right:40px">${t("privTitle")}</h2>${t("privText")}`;
  $("#modal").classList.add("on"); $("#sheet .close").onclick = closeModal;
}
function bookingMsg(){
  const s = CONFIG.services.find(x=>x.id===bk.service);
  const d = new Date(bk.date+"T12:00:00");
  const free = CONFIG.firstFree && bk.first;
  return t("msgBook")({ type:`${L(s.name)} (${s.time})`, price: free ? t("freeFirst") : priceText(s),
    when:`${fmtDate(d)} ${t("at")} ${bk.slot}`, name:bk.name, contact:bk.contact, lang:t("langs")[bk.lang], note:bk.note });
}
async function submitBooking(){
  if(bk.sending) return;
  bk.sending = true; renderBooking();
  let err = null;
  try{
    const r = await api("bookings", { service:bk.service, date:bk.date, slot:bk.slot, name:bk.name, contact:bk.contact,
      lang:t("langs")[bk.lang], note:bk.note || null, first_time:!!(CONFIG.firstFree && bk.first), app_lang:LANG, consent:true });
    if(!r.ok){ const j = await r.json().catch(()=>({})); err = j.code === "23505" ? "taken" : (String(j.message||"").includes("too_many") ? "tooMany" : "server"); }
  }catch(e){ err = "network"; }
  bk.sending = false;
  if(!err){ bk.done = true; bk.taken.add(`${bk.date} ${bk.slot}`); }
  else if(err === "taken"){ toast(t("errTaken")); bk.slot = null; bk.step = 1; await loadTaken(); }
  else { bk.error = err; }
  renderBooking(); window.scrollTo(0,0);
}
function renderBooking(){
  document.querySelectorAll("#steps i").forEach((el,i)=>el.classList.toggle("on", i<=bk.step));
  const root = $("#bk");
  if(bk.step===0){
    root.innerHTML = `${CONFIG.firstFree?`<div class="note green" style="font-size:1rem">🎁 ${t("firstFreeLong")}</div>`:""}<h3>${t("step1")}</h3><div class="opts">${CONFIG.services.map(s=>`
      <button class="opt ${bk.service===s.id?"on":""}" data-s="${s.id}"><span style="font-size:1.6rem">${s.icon}</span>
      <span style="flex:1"><b>${esc(L(s.name))}</b> · ${esc(s.time)}<small>${esc(L(s.desc))}</small>${s.details?`<ul class="det">${L(s.details).map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}${s.note?`<small><i>${esc(L(s.note))}</i></small>`:""}<span class="es">${esc(s.es)}</span></span><b class="price">${priceText(s)}</b></button>`).join("")}</div>
      <div class="note" style="margin-top:14px;background:#FFF0F5">${t("payVipps")}</div>
      <div class="note blue">${t("noDiagnosis")}</div>
      <button class="btn primary block" id="next" ${bk.service?"":"disabled"}>${t("next")}</button>`;
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{bk.service=b.dataset.s; renderBooking();});
    root.querySelector("#next").onclick = async ()=>{ bk.step=1; renderBooking(); window.scrollTo(0,0); await loadTaken(); if(bk.step===1) renderBooking(); };
    return;
  }
  if(bk.step===1){
    const days = upcoming();
    root.innerHTML = `<h3>${t("step2")}</h3><div class="days">${days.map(d=>{
        const iso=isoDate(d), open=!!CONFIG.schedule[d.getDay()] && !dayFull(iso);
        return `<button class="day ${bk.date===iso?"on":""}" data-d="${iso}" ${open?"":"disabled"}><small>${t("days")[d.getDay()]}</small><b>${d.getDate()}</b><small>${t("months")[d.getMonth()].slice(0,3)}</small></button>`;}).join("")}</div>
      ${bk.date?`<label>${t("slotsLabel")}</label><div class="slots">${slotsFor(bk.date).map(s=>{ const tk=isTaken(bk.date,s);
          return `<button class="slot ${bk.slot===s?"on":""}" data-t="${s}" ${tk?"disabled":""} title="${tk?esc(t("busy")):""}">${s}</button>`;}).join("")}</div>`
        :`<p class="es">${t("pickDay")}</p>`}
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px">
        <button class="btn ghost" id="back">${t("back")}</button><button class="btn primary" id="next" ${bk.date&&bk.slot?"":"disabled"}>${t("next")}</button></div>`;
    root.querySelectorAll(".day").forEach(b=>b.onclick=()=>{bk.date=b.dataset.d; bk.slot=null; renderBooking();});
    root.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{bk.slot=b.dataset.t; renderBooking();});
    const sel = root.querySelector(".day.on"); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
  }
  if(bk.step===2){
    if(SESSION){ const md = SESSION.user.user_metadata || {}; if(!bk.name) bk.name = md.name || ""; if(!bk.contact) bk.contact = md.phone || SESSION.user.email || ""; }
    const langIdx = bk.langTouched ? bk.lang : (LANG==="en" ? 1 : 0);
    root.innerHTML = `<h3>${t("step3")}</h3>
      <label for="bName">${t("bName")}</label><input id="bName" value="${esc(bk.name)}" autocomplete="name" maxlength="100">
      <label for="bContact">${t("bContact")}</label><input id="bContact" value="${esc(bk.contact)}" autocomplete="tel" maxlength="150">
      ${CONFIG.firstFree?`<label for="bFirst">${t("bFirst")}</label><select id="bFirst"><option value="1" ${bk.first?"selected":""}>${t("yes")}</option><option value="0" ${bk.first?"":"selected"}>${t("no")}</option></select>`:""}
      <label for="bLang">${t("bLang")}</label><select id="bLang">${t("langs").map((l,i)=>`<option value="${i}" ${langIdx===i?"selected":""}>${l}</option>`).join("")}</select>
      <label for="bNote">${t("bNote")}</label><textarea id="bNote" maxlength="1000" placeholder="${esc(t("bNotePh"))}">${esc(bk.note)}</textarea>
      <p class="es" style="margin-top:4px">${t("noHealthData")}</p>
      <label class="check"><input type="checkbox" id="bOk" ${bk.ok?"checked":""}> ${t("bOk")}</label>
      <label class="check"><input type="checkbox" id="bPriv" ${bk.privacy?"checked":""}> <span>${t("bPriv")} <a href="#bestill" id="privLink">${t("privLink")}</a></span></label>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px">
        <button class="btn ghost" id="back">${t("back")}</button><button class="btn primary" id="next">${t("summaryBtn")}</button></div>`;
    const save=()=>{bk.name=$("#bName").value.trim(); bk.contact=$("#bContact").value.trim(); bk.lang=+$("#bLang").value; if($("#bFirst")) bk.first=$("#bFirst").value==="1"; bk.note=$("#bNote").value.trim(); bk.ok=$("#bOk").checked; bk.privacy=$("#bPriv").checked;};
    $("#bLang").addEventListener("change", ()=>{ bk.langTouched=true; });
    $("#privLink").onclick = e => { e.preventDefault(); openPrivacy(); };
    root.querySelectorAll("input,select,textarea").forEach(el=>el.addEventListener("input",save));
    save();
    root.querySelector("#next").onclick = ()=>{ save(); if(!bk.name||bk.contact.length<3){toast(t("fillIn"));return;} if(!bk.ok||!bk.privacy){toast(t("tickOk"));return;} bk.step=3; bk.error=null; renderBooking(); window.scrollTo(0,0); };
    root.querySelector("#back").onclick = ()=>{ save(); bk.step=1; renderBooking(); };
    return;
  }
  if(bk.step===3){
    const msg = bookingMsg();
    if(bk.done){
      root.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:2.6rem">✅</div><h3>${t("sentTitle")}</h3>
        <p>${t("sentText")(esc(bk.contact))}</p><div class="summary" style="text-align:left">${esc(msg)}</div></div>
        <div class="note green">${t("requestNote")}</div>
        <div class="note blue">${SESSION ? t("aSeeMine") : t("aLoginToSee")}</div>
        <button class="btn ghost block" id="restart">${t("newBooking")}</button>`;
    } else if(bk.error){
      root.innerHTML = `<div class="note">${t(bk.error==="tooMany"?"errTooMany":"errSend")}</div>` + (bk.error==="tooMany" ? "" : sendBox(msg, t("step4alt"))) +
        `<button class="btn ghost block" id="restart">${t("restart")}</button>`;
      if(bk.error!=="tooMany") bindCopy(root, msg);
    } else {
      root.innerHTML = `<h3>${t("step4")}</h3><div class="summary">${esc(msg)}</div>
        <div class="note green" style="margin-top:14px">${t("requestNote")}</div>
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">
          <button class="btn ghost" id="back">${t("back")}</button>
          <button class="btn primary" id="send" ${bk.sending?"disabled":""}>${bk.sending?t("sending"):t("sendBtn")}</button></div>`;
      root.querySelector("#send").onclick = submitBooking;
      root.querySelector("#back").onclick = ()=>{ bk.step=2; renderBooking(); };
      return;
    }
    root.querySelector("#restart").onclick = ()=>{ Object.assign(bk,{step:0,service:null,date:null,slot:null,note:"",ok:false,privacy:false,done:false,error:null}); renderBooking(); };
    return;
  }
  const n=root.querySelector("#next"), b=root.querySelector("#back");
  if(n) n.onclick=()=>{bk.step++; renderBooking(); window.scrollTo(0,0);};
  if(b) b.onclick=()=>{bk.step--; renderBooking();};
}

/* ---------- Min side (pasientkonto) ---------- */
let SESSION = null;
const sbc = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key) : null;
const acct = { tab:"login", msg:"", msgOk:false, mode:null, list:null, busy:false, sure:null };
const authReturn = /access_token|error_description|type=recovery/.test(location.hash);
const hashErr = (() => { const m = location.hash.match(/error_code=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; })();
function setMsg(k, ok){ acct.msg = k ? t(k) : ""; acct.msgOk = !!ok; renderAccount(); }
async function loadMine(){
  if(!sbc || !SESSION) return;
  const { data, error } = await sbc.rpc("my_bookings");
  acct.list = error ? [] : data; renderAccount();
}
function svcName(id){ const s = CONFIG.services.find(x=>x.id===id); return s ? L(s.name) : id; }
function bookingCard(b, canCancel){
  const d = new Date(b.date+"T12:00:00");
  const col = {pendiente:"#8a5a00;background:#FBF0D9", confirmada:"#2E7D5B;background:#E2F1EA", cancelada:"#C62828;background:#FDECEC", realizada:"#555;background:#eee"}[b.status];
  return `<div class="card" style="padding:14px">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><b>${esc(fmtDate(d))} · ${b.slot.slice(0,5)}</b><br><span>${esc(svcName(b.service))}</span>${b.first_time?` <span class="es" style="display:inline">· ${t("freeFirst")}</span>`:""}</div>
      <span style="border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800;white-space:nowrap;color:${col}">${t("st")[b.status]}</span></div>
    ${canCancel?`<button class="btn ghost" style="margin-top:10px;padding:8px 12px" data-cancel="${b.id}">${acct.sure===b.id?t("aCancelSure"):t("aCancel")}</button>`:""}
  </div>`;
}
function renderAccount(){
  const root = $("#acct"); if(!root) return;
  const msg = acct.msg ? `<div class="note ${acct.msgOk?"green":""}">${esc(acct.msg)}</div>` : "";
  if(!sbc){ root.innerHTML = `<div class="note">${t("aOffline")}</div>`; return; }
  if(acct.mode === "newpw"){
    root.innerHTML = `${msg}<form class="card" id="fNewPw"><h3>${t("aNewPwTitle")}</h3>
      <label for="aNewPw">${t("aPwNew")}</label><input id="aNewPw" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary block" style="margin-top:14px">${t("aSavePw")}</button></form>`;
    $("#fNewPw").onsubmit = async e => { e.preventDefault(); const pw=$("#aNewPw").value;
      if(pw.length<8) return setMsg("aPwShort");
      const { error } = await sbc.auth.updateUser({ password: pw });
      if(error) return setMsg("aErr");
      acct.mode = null; setMsg("aPwSaved", true); loadMine(); };
    return;
  }
  if(!SESSION){
    const tabs = [["login","aLogin"],["signup","aSignup"]];
    let form = "";
    if(acct.tab==="login") form = `<form class="card" id="fLogin">
      <label for="aEm">${t("aEmail")}</label><input id="aEm" type="email" autocomplete="email" required>
      <label for="aPwd">${t("aPw")}</label><input id="aPwd" type="password" autocomplete="current-password" required>
      <button class="btn primary block" style="margin-top:14px" ${acct.busy?"disabled":""}>${t("aLoginBtn")}</button>
      <p style="margin:12px 0 0;text-align:center"><a href="#konto" id="toForgot">${t("aForgot")}</a></p></form>`;
    if(acct.tab==="signup") form = `<form class="card" id="fSignup">
      <label for="sName">${t("aName")}</label><input id="sName" autocomplete="name" maxlength="100" required>
      <label for="sPhone">${t("aPhone")}</label><input id="sPhone" type="tel" autocomplete="tel" maxlength="30">
      <label for="sEm">${t("aEmail")}</label><input id="sEm" type="email" autocomplete="email" required>
      <label for="sPw">${t("aPwNew")}</label><input id="sPw" type="password" autocomplete="new-password" minlength="8" required>
      <label class="check"><input type="checkbox" id="sPriv" required> <span>${t("bPriv")} <a href="#konto" id="sPrivLink">${t("privLink")}</a></span></label>
      <button class="btn primary block" style="margin-top:14px" ${acct.busy?"disabled":""}>${t("aSignupBtn")}</button></form>`;
    if(acct.tab==="forgot") form = `<form class="card" id="fForgot">
      <label for="fEm">${t("aEmail")}</label><input id="fEm" type="email" autocomplete="email" required>
      <button class="btn primary block" style="margin-top:14px" ${acct.busy?"disabled":""}>${t("aSendReset")}</button>
      <p style="margin:12px 0 0;text-align:center"><a href="#konto" id="toLogin">← ${t("aLogin")}</a></p></form>`;
    root.innerHTML = `<p>${t("aIntro")}</p><div class="chips">${tabs.map(([k,l])=>`<button class="chip ${acct.tab===k?"on":""}" data-tab="${k}">${t(l)}</button>`).join("")}</div>${msg}${form}`;
    root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ acct.tab=b.dataset.tab; acct.msg=""; renderAccount(); });
    const busy = async fn => { acct.busy=true; try{ await fn(); } finally { acct.busy=false; } };
    if($("#toForgot")) $("#toForgot").onclick = e => { e.preventDefault(); acct.tab="forgot"; acct.msg=""; renderAccount(); };
    if($("#toLogin")) $("#toLogin").onclick = e => { e.preventDefault(); acct.tab="login"; acct.msg=""; renderAccount(); };
    if($("#sPrivLink")) $("#sPrivLink").onclick = e => { e.preventDefault(); openPrivacy(); };
    if($("#fLogin")) $("#fLogin").onsubmit = e => { e.preventDefault(); busy(async()=>{
      const { error } = await sbc.auth.signInWithPassword({ email: $("#aEm").value.trim(), password: $("#aPwd").value });
      if(error) setMsg(/confirm/i.test(error.message) ? "aNotConfirmed" : "aBadLogin"); else { acct.msg=""; }
    }); };
    if($("#fSignup")) $("#fSignup").onsubmit = e => { e.preventDefault(); busy(async()=>{
      if($("#sPw").value.length<8) return setMsg("aPwShort");
      const { data, error } = await sbc.auth.signUp({ email: $("#sEm").value.trim(), password: $("#sPw").value,
        options: { emailRedirectTo: CONFIG.appUrl, data: { name: $("#sName").value.trim(), phone: $("#sPhone").value.trim(), lang: LANG } } });
      if(error) return setMsg(/registered|exists/i.test(error.message) ? "aExists" : "aErr");
      if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return setMsg("aExists");
      if(!data.session){ acct.tab="login"; setMsg("aCheckMail", true); }
    }); };
    if($("#fForgot")) $("#fForgot").onsubmit = e => { e.preventDefault(); busy(async()=>{
      await sbc.auth.resetPasswordForEmail($("#fEm").value.trim(), { redirectTo: CONFIG.appUrl });
      setMsg("aResetSent", true);
    }); };
    return;
  }
  const md = SESSION.user.user_metadata || {};
  const today = isoDate(new Date());
  const list = acct.list || [];
  const up = list.filter(b => b.date >= today && b.status !== "realizada").sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  const past = list.filter(b => !(b.date >= today && b.status !== "realizada"));
  const canCancel = b => b.date > today && (b.status === "pendiente" || b.status === "confirmada");
  root.innerHTML = `${msg}<div class="card hero"><h2 style="color:#fff">${esc(t("aHello")(md.name||""))}</h2>
      <p style="margin:0 0 12px">${esc(SESSION.user.email)}</p><a class="btn primary" href="#bestill">${t("aBookNew")}</a></div>
    <h3>${t("aUpcoming")}</h3>
    ${acct.list===null ? `<p class="es">…</p>` : (up.length ? up.map(b=>bookingCard(b, canCancel(b))).join("") : `<p class="es">${t("aNone")}</p>`)}
    ${up.some(canCancel) ? `<p class="es" style="margin:-4px 0 14px">${t("aCancelRule")}</p>` : ""}
    ${past.length ? `<h3 style="margin-top:18px">${t("aPast")}</h3>${past.map(b=>bookingCard(b,false)).join("")}` : ""}
    <details style="margin-top:18px"><summary>👤 ${t("aProfile")}</summary><div class="body">
      <label for="pName">${t("aName")}</label><input id="pName" value="${esc(md.name||"")}" maxlength="100">
      <label for="pPhone">${t("aPhone")}</label><input id="pPhone" value="${esc(md.phone||"")}" maxlength="30">
      <button class="btn ghost" style="margin-top:10px" id="pSave">${t("aSaveProfile")}</button>
      <label for="pPw" style="margin-top:18px">${t("aChangePw")}</label><input id="pPw" type="password" autocomplete="new-password" placeholder="${esc(t("aPwNew"))}">
      <button class="btn ghost" style="margin-top:10px" id="pPwSave">${t("aSavePw")}</button>
      <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
      <button class="btn ghost" id="pDelete" style="color:#C62828">${acct.sure==="del"?t("aDeleteSure"):t("aDelete")}</button>
    </div></details>
    <button class="btn ghost block" style="margin-top:14px" id="pLogout">${t("aLogout")}</button>`;
  root.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.cancel; if(acct.sure!==id){ acct.sure=id; return renderAccount(); }
    acct.sure=null; const { error } = await sbc.rpc("cancel_my_booking", { b_id:id });
    setMsg(error ? "aErr" : "aCancelled", !error); bk.taken = new Set(); loadMine(); });
  $("#pSave").onclick = async()=>{ const { data, error } = await sbc.auth.updateUser({ data: { name: $("#pName").value.trim(), phone: $("#pPhone").value.trim() } });
    if(!error && data.user) SESSION.user = data.user; setMsg(error?"aErr":"aSaved", !error); };
  $("#pPwSave").onclick = async()=>{ const pw=$("#pPw").value; if(pw.length<8) return setMsg("aPwShort");
    const { error } = await sbc.auth.updateUser({ password: pw }); setMsg(error?"aErr":"aPwSaved", !error); };
  $("#pDelete").onclick = async()=>{ if(acct.sure!=="del"){ acct.sure="del"; return renderAccount(); }
    acct.sure=null; const { error } = await sbc.rpc("delete_my_account"); if(error) return setMsg("aErr");
    await sbc.auth.signOut(); setMsg("aDeleted", true); };
  $("#pLogout").onclick = async()=>{ await sbc.auth.signOut(); acct.msg=""; renderAccount(); };
}
if(sbc){
  sbc.auth.onAuthStateChange((event, session) => {
    SESSION = session;
    if(event === "PASSWORD_RECOVERY"){ acct.mode = "newpw"; location.hash = "konto"; }
    if(event === "SIGNED_OUT"){ acct.list = null; acct.mode = null; }
    if(session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) setTimeout(loadMine, 0);
    if(event === "SIGNED_IN" && authReturn) location.hash = "konto";
    renderAccount();
    if(bk.step === 2) renderBooking();
  });
}
if(hashErr){ acct.msg = t("aLinkExpired"); location.hash = "konto"; }

function renderAll(){ applyStatic(); showTip(); renderPosts(); renderGuides(); renderWords(); renderFaq(); renderBooking(); renderAccount(); }
renderAll();
route();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(r=>r.update()).catch(()=>{});
  // Når en ny versjon er installert: last siden på nytt én gang
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!reloaded){ reloaded=true; location.reload(); } });
}
</script>
</body>
